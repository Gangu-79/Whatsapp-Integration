services:
  - type: web
    name: whatsapp-campaign-engine
    env: node
    plan: free
    buildCommand: npm install && (pip install -r requirements.txt || pip3 install -r requirements.txt || true)
    startCommand: node gateway.js
    autoDeploy: true
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: "campaign_update"
      - key: WEBHOOK_VERIFY_TOKEN
        value: "whatsapp_campaign_verify_token_123"
      - key: USE_CLAUDE
        value: "false"
